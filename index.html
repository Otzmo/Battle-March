<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle March – Spielablauf-Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

:root{
  --parchment:#f4ecd8;
  --parchment-dark:#e9dcbe;
  --panel:#fbf5e6;
  --ink:#2b2013;
  --maroon:#7a1f1f;
  --maroon-dark:#5c1616;
  --gold:#a9812f;
  --line:#8a7f6b;
  --good:#3c5a34;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(ellipse at top left, rgba(122,31,31,0.06), transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(169,129,47,0.08), transparent 55%),
    var(--parchment);
  color:var(--ink);
  font-family:"EB Garamond", Georgia, serif;
  font-size:18px;
  line-height:1.5;
  padding:2rem 1rem 4rem;
  min-height:100vh;
}
.wrap{ max-width:760px; margin:0 auto; }

/* ---- Header ---- */
header{ text-align:center; margin-bottom:1.6rem; }
.eyebrow{
  font-family:"Cinzel", serif;
  letter-spacing:0.32em;
  font-size:0.72rem;
  color:var(--maroon);
  text-transform:uppercase;
  margin:0 0 0.3rem;
}
h1.title{
  font-family:"Cinzel", serif;
  font-weight:700;
  font-size:2.6rem;
  margin:0;
  color:var(--maroon-dark);
  text-shadow:0 1px 0 rgba(255,255,255,0.4);
}
p.subtitle{
  margin:0.35rem 0 0;
  font-style:italic;
  color:#5a5040;
  font-size:1.05rem;
}

/* deckle-edge divider */
.deckle{ height:14px; margin:1.4rem 0; opacity:0.55; }

/* ---- Duel setup ---- */
.duel{
  display:flex; gap:0.8rem; align-items:center; justify-content:center;
  flex-wrap:wrap;
  margin-bottom:1.6rem;
}
.duel label{ font-family:"Cinzel",serif; font-size:0.68rem; letter-spacing:0.08em; color:var(--maroon); text-transform:uppercase; display:block; margin-bottom:0.2rem;}
.duel input{
  font-family:"EB Garamond", serif;
  font-size:1rem;
  padding:0.4rem 0.7rem;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:3px;
  color:var(--ink);
  width:160px;
}
.duel input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
.vs{ font-family:"Cinzel",serif; color:var(--gold); font-weight:700; padding-top:1.1rem;}

/* ---- Main seal button ---- */
.seal-row{ display:flex; justify-content:center; margin:1.6rem 0 2.2rem; }
.seal{
  font-family:"Cinzel", serif;
  font-weight:700;
  letter-spacing:0.05em;
  font-size:1.05rem;
  color:#f4ecd8;
  background:radial-gradient(circle at 35% 30%, #8f2828, var(--maroon) 55%, var(--maroon-dark) 100%);
  border:3px solid #c79a4b;
  box-shadow:0 3px 0 var(--maroon-dark), 0 6px 14px rgba(0,0,0,0.25), inset 0 0 0 2px rgba(255,255,255,0.08);
  border-radius:50%;
  width:168px; height:168px;
  cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.3rem;
  transition:transform 0.15s ease, box-shadow 0.15s ease;
  text-align:center;
  padding:0.5rem;
}
.seal:hover{ transform:translateY(-2px); box-shadow:0 5px 0 var(--maroon-dark), 0 10px 18px rgba(0,0,0,0.28), inset 0 0 0 2px rgba(255,255,255,0.1); }
.seal:active{ transform:translateY(1px); box-shadow:0 2px 0 var(--maroon-dark), 0 4px 10px rgba(0,0,0,0.25); }
.seal:focus-visible{ outline:3px solid var(--gold); outline-offset:4px; }
.seal .dieface{ font-size:2.1rem; line-height:1; }
.seal.rolling .dieface{ animation:spin 0.5s linear infinite; }
@keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

.reset-link{
  display:block; text-align:center; margin-top:-1.4rem; margin-bottom:1.8rem;
  font-family:"Cinzel",serif; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--line); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0.3rem;
}
.reset-link:hover{ color:var(--maroon); }
.reset-link:disabled{ visibility:hidden; }

/* ---- Summary strip ---- */
#summary{
  display:none;
  background:var(--parchment-dark);
  border:1px solid var(--line);
  border-radius:6px;
  padding:0.9rem 1.1rem;
  margin-bottom:2rem;
  font-size:0.92rem;
}
#summary.show{ display:block; }
#summary h2{
  font-family:"Cinzel",serif; font-size:0.75rem; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--maroon); margin:0 0 0.5rem;
}
#summary ul{ list-style:none; margin:0; padding:0; columns:2; column-gap:1.4rem;}
#summary li{ break-inside:avoid; margin-bottom:0.35rem; }
#summary li b{ color:var(--maroon-dark); }

/* ---- Step cards ---- */
.step{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:5px solid var(--maroon);
  border-radius:4px;
  padding:1.1rem 1.3rem 1.2rem;
  margin-bottom:1.1rem;
  opacity:0;
  transform:translateY(6px);
  transition:opacity 0.35s ease, transform 0.35s ease;
}
.step.visible{ opacity:1; transform:translateY(0); }
.step-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:0.8rem; flex-wrap:wrap;
  border-bottom:1px solid #d8cba3; padding-bottom:0.45rem; margin-bottom:0.6rem;
}
.step-num{
  font-family:"Cinzel",serif; color:var(--gold); font-weight:600; font-size:0.95rem; margin-right:0.5rem;
}
.step-label{
  font-family:"Cinzel",serif; font-weight:600; font-size:1.02rem; color:var(--maroon-dark);
}
.step-sub{ font-size:0.85rem; color:#6b5f48; font-style:italic; margin-left:auto; }
.reroll-btn{
  background:none; border:1px solid var(--line); color:var(--maroon-dark);
  border-radius:3px; font-family:"EB Garamond",serif; font-size:0.85rem;
  padding:0.15rem 0.55rem; cursor:pointer;
}
.reroll-btn:hover{ background:var(--parchment-dark); }
.reroll-btn:focus-visible{ outline:2px solid var(--gold); }

.dice-row{ display:flex; align-items:center; gap:0.6rem; margin:0.4rem 0 0.7rem; flex-wrap:wrap; }
.die{
  font-size:1.8rem; width:2.1rem; text-align:center; color:var(--maroon-dark);
}
.die.small{ font-size:1.3rem; }
.die-tag{
  font-family:"Cinzel",serif; font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; color:#6b5f48;
}
.duel-result{ display:flex; align-items:center; gap:1.4rem; flex-wrap:wrap; margin:0.3rem 0 0.6rem;}
.duel-side{ text-align:center; }
.duel-side .name{ font-family:"Cinzel",serif; font-size:0.78rem; color:var(--maroon); text-transform:uppercase; letter-spacing:0.04em;}
.winner-badge{
  font-family:"Cinzel",serif; font-size:0.75rem; letter-spacing:0.06em; text-transform:uppercase;
  background:var(--good); color:#f4ecd8; padding:0.2rem 0.6rem; border-radius:3px;
}
.tie-note{ font-size:0.82rem; font-style:italic; color:var(--maroon); }

.result-name{ font-weight:600; color:var(--maroon-dark); font-size:1.05rem; }
.result-desc{ margin:0.3rem 0 0; }
.note-box{
  background:#fff8e1; border:1px solid #e0c060; padding:0.5rem 0.8rem; font-size:0.85rem; margin-top:0.6rem; border-radius:3px;
}
.zone-svg{ margin-top:0.5rem; max-width:220px; }
.zone-svg svg{ display:block; width:100%; height:auto; }

.subtable{ margin-top:0.6rem; font-size:0.88rem; }
.subtable-title{ font-family:"Cinzel",serif; font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--maroon); margin-bottom:0.3rem;}
.subtable table{ width:100%; border-collapse:collapse; }
.subtable td{ border:1px solid #d8cba3; padding:0.3rem 0.5rem; vertical-align:top; }
.subtable td:first-child{ width:2.2rem; text-align:center; font-weight:600; color:var(--maroon-dark); }
.subtable tr.hit{ background:var(--parchment-dark); }

.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

@media (prefers-reduced-motion: reduce){
  .step{ transition:none; }
  .seal.rolling .dieface{ animation:none; }
}
</style>
</head>

  <h1 class="title">Battle March</h1>

<button class="reset-link" id="resetBtn" type="button" disabled>Alles neu würfeln</button>

<div id="summary" aria-live="polite">

</div>

<div id="steps"></div>

<p class="sr-only" id="liveRegion" aria-live="polite"></p>

</div>

  ];

  const landmarkTable = [
    { range:[1,2], text:"Magie in der Luft – kontrollierende Einheit erhält Magieresistenz (2)." },
    { range:[3,4], text:"Rechtschaffener Eifer – kontrollierende Einheit erhält Raserei." },
    { range:[5,6], text:"„Wir gehen hier nicht weg“ – kontrollierende Einheit erhält Unnachgiebig." }
  ];

  const happeningTypes = [
    { name:"Störendes Wetter", when:"Einmalig zu Beginn des Spiels gewürfelt, gilt für die gesamte Spieldauer.", rollNow:true,
      table:[
        "Heftiger Platzregen – alle Einheiten −1 Bewegung (min. 1); Schnelle Bewegung/Fliegen (2) nicht nutzbar.",
        "Steife Brise – Reichweite von Fernkampfwaffen mit Stärke 5 oder weniger sinkt um 6\" (min. 3\").",
        "Sengende Hitze – jede Einheit würfelt zu Zugbeginn: bei 1 (schwere Rüstung/Plattenrüstung/Rossharnisch bei 1–2) verlieren W3 Modelle einen Lebenspunkt bei misslungenem Widerstandstest.",
        "Blitzeinschläge – jeder Spieler würfelt zu Zugbeginn: bei 1–2 erleidet eine zufällige Einheit W6 Treffer, Stärke 4, DS −1.",
        "Staubteufel – eine 3\"-Schablone wandert zufällig über das Feld; getroffene Einheiten −1 BF bis zum nächsten Zugbeginn.",
        "Eisiger Wind – jede Einheit würfelt zu Zugbeginn: bei 1 Moraltest nötig, sonst kein Angriff/Zaubern in diesem Zug (Pflichtbewegungen ausgenommen)."
      ]
    },
    { name:"Wildnisgelände", when:"Wird während des Spiels ausgelöst, sobald eine Einheit ihre Bewegung in natürlichem Gelände beendet oder dort aufgestellt wird.", rollNow:false,
      table:[
        "Dornengestrüpp – Bewegung, Angriff, Flucht oder Verfolgung hindurch erfolgt in Unordnung.",
        "Verteidigungsposition – besetzende Einheit ignoriert Sichtlinien-Einschränkungen beim Verteidigen.",
        "Giftige Sporen – jedes Modell im Gelände braucht einen Widerstandstest oder verliert einen Lebenspunkt.",
        "Anhaltende Magie – Einheiten im Gelände erhalten Magieresistenz (1).",
        "Heilkräuter – ein Modell (nicht im Nahkampf) erhält sofort einen verlorenen Lebenspunkt zurück.",
        "Trollversteck – ein Aufgebrachter Troll greift die entdeckende Einheit an."
      ]
    },
    { name:"Unwägbarkeiten des Krieges", when:"Ab Zug 2: zu jedem Zugbeginn W6 würfeln; bei Ergebnis ≤ Zugnummer würfelt der Gegner auf dieser Tabelle (bereits gewürfelte Ergebnisse neu würfeln).", rollNow:false,
      table:[
        "Ätherische Instabilität – ein natürlicher Pasch aus 1/2/3 bei einem Zauberwurf löst eine Verhexung aus.",
        "Verlegte Ressourcen – ein Versorgungswagen taucht am Feldrand auf; Sieger eines Stichwurfs erhält ihn, Verlierer muss ihn zerstören.",
        "Schwindende Munition – eine Einheit, die geschossen hat, darf im folgenden Zug nicht erneut mit Fernkampfwaffen schießen.",
        "Schätze des Hinterlands – Schatzfunde geben 20 statt 10, Landmarken 50 statt 25 Siegpunkte.",
        "Schleppender Konflikt – das Spiel dauert sechs statt fünf Runden.",
        "Wandernde Söldner – Stichwurf um eine Einheit von 10 Söldnern; bei Gleichstand erhalten beide Spieler eine Einheit."
      ]
    }
  ];

  // ---------- step definitions ----------
  // each step: id, num (roman), label, sub, run(container) -> returns summary text

  function romanize(n){ return ["I","II","III","IV","V","VI","VII"][n-1]; }

  function animateDie(el, finalFace, sides, cb){
    if(reduceMotion){ el.textContent = sides===6 ? dieFaces[finalFace] : finalFace; if(cb) cb(); return; }
    let ticks = 0; const maxTicks = 9;
    const iv = setInterval(function(){
      ticks++;
      const r = 1 + Math.floor(Math.random()*sides);
      el.textContent = sides===6 ? dieFaces[r] : r;
      if(ticks>=maxTicks){
        clearInterval(iv);
        el.textContent = sides===6 ? dieFaces[finalFace] : finalFace;
        if(cb) cb();
      }
    }, 45);
  }

  function makeStepShell(num, label, subText){
    const step = document.createElement('div');
    step.className = 'step';
    step.innerHTML =
      '<div class="step-head">' +
        '<div><span class="step-num">' + romanize(num) + '.</span><span class="step-label">' + label + '</span></div>' +
        (subText ? '<div class="step-sub">' + subText + '</div>' : '') +
      '</div>' +
      '<div class="step-body"></div>';
    return step;
  }

  function subtable(rows, hitIndex){
    let html = '<table><tbody>';
    rows.forEach(function(r, i){
      html += '<tr class="' + (i===hitIndex?'hit':'') + '"><td>' + (i+1) + '</td><td>' + r + '</td></tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  // Step 1: Geländeaufstellung (Karte)
  function stepTerrain(container){
    const step = makeStepShell(1, "Geländeaufstellung", "W6");
    const body = step.querySelector('.step-body');
    body.innerHTML =
      '<div class="dice-row"><span class="die" id="d1"></span></div>' +
      '<div class="result-body"></div>';
    container.appendChild(step);
    requestAnimationFrame(function(){ step.classList.add('visible'); });

    const val = roll(6);
    const dieEl = step.querySelector('#d1');
    animateDie(dieEl, val, 6, function(){
      step.querySelector('.result-body').innerHTML =
        '<p class="result-name">Geländekarte ' + val + ' von 6</p>' +
        '<p class="result-desc">Matte 48×36 Zoll. Alternativ: von jedem Geländetyp ein Stück auf die Matte setzen. In der Mitte einen 15" Kreis freihalten.</p>';
    });
    return { step: step, label: "Gelände", value: "Karte " + val, done: function(cb){ setTimeout(cb, 500); } };
  }

  // Step 2: Random Happenings – Art
  function stepHappenings(container){
    const step = makeStepShell(2, "Random Happenings – Art", "W3");
    const body = step.querySelector('.step-body');
    body.innerHTML = '<div class="dice-row"><span class="die small" id="d2"></span><span class="die-tag">W3</span></div><div class="result-body"></div>';
    container.appendChild(step);
    requestAnimationFrame(function(){ step.classList.add('visible'); });

    const val = roll(3);
    const type = happeningTypes[val-1];
    const dieEl = step.querySelector('#d2');
    animateDie(dieEl, val, 3, function(){
      let html = '<p class="result-name">' + val + '. ' + type.name + '</p>' +
                 '<p class="result-desc">' + type.when + '</p>';
      if(type.rollNow){
        const sub = roll(6);
        html += '<div class="dice-row"><span class="die" id="d2b"></span></div><div id="d2sub"></div>';
        step.querySelector('.result-body').innerHTML = html;
        const subDie = step.querySelector('#d2b');
        animateDie(subDie, sub, 6, function(){
          step.querySelector('#d2sub').innerHTML =
            '<p class="result-name">Ergebnis ' + sub + ': ' + type.table[sub-1].split(' – ')[0] + '</p>' +
            '<p class="result-desc">' + type.table[sub-1] + '</p>';
        });
        step.__summary = type.name + " (" + type.table[sub-1].split(' – ')[0] + ")";
      } else {
        html += '<div class="subtable"><div class="subtable-title">Tabelle zur Referenz (wird im Spielverlauf gewürfelt)</div>' + subtable(type.table, -1) + '</div>';
        step.querySelector('.result-body').innerHTML = html;
        step.__summary = type.name;
      }
    });
    return { step: step };
  }

  // Step 3: Mission
  function stepMission(container){
    const step = makeStepShell(3, "Mission", "W3");
    const body = step.querySelector('.step-body');
    body.innerHTML = '<div class="dice-row"><span class="die small" id="d3"></span><span class="die-tag">W3</span></div><div class="result-body"></div>';
    container.appendChild(step);
    requestAnimationFrame(function(){ step.classList.add('visible'); });

    const val = roll(3);
    const m = missions[val-1];
    const dieEl = step.querySelector('#d3');
    animateDie(dieEl, val, 3, function(){
      let html = '<p class="result-name">' + val + '. ' + m.name + '</p>' +
                 '<p class="result-desc">' + m.desc + '</p>' +
                 '<p class="result-desc"><b>Siegpunkte:</b> ' + m.points + '</p>';
      if(val === 2){
        const sub = roll(6);
        const entry = landmarkTable.find(function(t){ return sub>=t.range[0] && sub<=t.range[1]; });
        html += '<div class="dice-row"><span class="die" id="d3b"></span></div><div id="d3sub"></div>';
        step.querySelector('.result-body').innerHTML = html;
        const subDie = step.querySelector('#d3b');
        animateDie(subDie, sub, 6, function(){
          step.querySelector('#d3sub').innerHTML =
            '<p class="result-name">Eigenschaft der Landmarke (Wurf ' + sub + ')</p>' +
            '<p class="result-desc">' + entry.text + '</p>';
        });
        step.__summary = m.name;
      } else {
        step.querySelector('.result-body').innerHTML = html;
        step.__summary = m.name;
      }
    });
    return { step: step };
  }

  // Step 4: Aufstellungszone
  function stepZone(container){
    const step = makeStepShell(4, "Aufstellungszone", "W6");
    const body = step.querySelector('.step-body');
    body.innerHTML = '<div class="dice-row"><span class="die" id="d4"></span></div><div class="result-body"></div>';
    container.appendChild(step);
    requestAnimationFrame(function(){ step.classList.add('visible'); });

    const val = roll(6);
    const z = zones[val-1];
    const dieEl = step.querySelector('#d4');
    animateDie(dieEl, val, 6, function(){
      step.querySelector('.result-body').innerHTML =
        '<p class="result-name">' + val + '. ' + z.name + '</p>' +
        '<p class="result-desc">' + z.desc + '</p>' +
        '<div class="zone-svg">' + zoneSVGs[val] + '</div>' +
        '<p class="note-box">Zonen 2, 3, 4 und 6 dürfen nach Wunsch horizontal gespiegelt werden – im Zweifel entscheidet ein W6.</p>';
      step.__summary = z.name;
    });
    return { step: step };
  }

  function duelRoll(){
    let a = roll(6), b = roll(6), ties = 0;
    while(a === b && ties < 20){ a = roll(6); b = roll(6); ties++; }
    return { a:a, b:b, ties:ties };
  }

  function stepDuel(num, label, winnerAction, container){
    const step = makeStepShell(num, label, "W6 gegeneinander");
    const body = step.querySelector('.step-body');
    const p1 = document.getElementById('p1').value.trim() || "Spieler 1";
    const p2 = document.getElementById('p2').value.trim() || "Spieler 2";
    body.innerHTML =
      '<div class="duel-result">' +
        '<div class="duel-side"><div class="name">' + escapeHtml(p1) + '</div><span class="die" id="d' + num + 'a"></span></div>' +
        '<div class="duel-side"><div class="name">' + escapeHtml(p2) + '</div><span class="die" id="d' + num + 'b"></span></div>' +
      '</div><div class="result-body"></div>';
    container.appendChild(step);
    requestAnimationFrame(function(){ step.classList.add('visible'); });

    const res = duelRoll();
    const dieA = step.querySelector('#d' + num + 'a');
    const dieB = step.querySelector('#d' + num + 'b');
    let doneA = false, doneB = false;
    function finish(){
      if(!doneA || !doneB) return;
      const winnerName = res.a > res.b ? p1 : p2;
      let html = '<p><span class="winner-badge">' + escapeHtml(winnerName) + '</span> ' + winnerAction + '</p>';
      if(res.ties > 0){
        html += '<p class="tie-note">' + res.ties + ' Gleichstand' + (res.ties>1?'e':'') + ' vor der Entscheidung neu gewürfelt.</p>';
      }
      step.querySelector('.result-body').innerHTML = html;
      step.__summary = winnerName;
    }
    animateDie(dieA, res.a, 6, function(){ doneA = true; finish(); });
    animateDie(dieB, res.b, 6, function(){ doneB = true; finish(); });
    return { step: step };
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- orchestration ----------
  const stepsContainer = document.getElementById('steps');
  const rollAllBtn = document.getElementById('rollAllBtn');
  const resetBtn = document.getElementById('resetBtn');
  const sealDie = document.getElementById('sealDie');
  const summary = document.getElementById('summary');
  const summaryList = document.getElementById('summaryList');
  const liveRegion = document.getElementById('liveRegion');

  function buildSummary(refs){
    summaryList.innerHTML = '';
    const labels = ["Gelände", "Random Happenings", "Mission", "Aufstellungszone", "Tischseite", "Zuerst aufstellen", "Zuerst am Zug"];
    refs.forEach(function(r, i){
      const li = document.createElement('li');
      li.innerHTML = '<b>' + labels[i] + ':</b> <span data-idx="' + i + '"></span>';
      summaryList.appendChild(li);
    });
    summary.classList.add('show');
  }

  function fillSummarySlot(idx, text){
    const el = summaryList.querySelector('[data-idx="' + idx + '"]');
    if(el) el.textContent = text;
  }

  function rollAll(){
    stepsContainer.innerHTML = '';
    rollAllBtn.classList.add('rolling');
    rollAllBtn.disabled = true;
    resetBtn.disabled = true;
    liveRegion.textContent = 'Der Spielablauf wird ausgewürfelt.';

    const refs = [null,null,null,null,null,null,null];
    buildSummary(refs);

    let delay = 0;
    const gap = 260;

    setTimeout(function(){ const r = stepTerrain(stepsContainer); pollSummary(r, 0); }, delay); delay += gap;
    setTimeout(function(){ const r = stepHappenings(stepsContainer); pollSummary(r, 1); }, delay); delay += gap;
    setTimeout(function(){ const r = stepMission(stepsContainer); pollSummary(r, 2); }, delay); delay += gap;
    setTimeout(function(){ const r = stepZone(stepsContainer); pollSummary(r, 3); }, delay); delay += gap;
    setTimeout(function(){ const r = stepDuel(5, "Tischseite", "wählt die Tischseite.", stepsContainer); pollSummary(r, 4); }, delay); delay += gap;
    setTimeout(function(){ const r = stepDuel(6, "Aufstellungsreihenfolge", "stellt die erste Einheit auf.", stepsContainer); pollSummary(r, 5); }, delay); delay += gap;
    setTimeout(function(){
      const r = stepDuel(7, "Zugreihenfolge", "ist zuerst am Zug.", stepsContainer);
      pollSummary(r, 6);
      setTimeout(function(){
        rollAllBtn.classList.remove('rolling');
        rollAllBtn.disabled = false;
        resetBtn.disabled = false;
        liveRegion.textContent = 'Der Spielablauf wurde vollständig ausgewürfelt.';
      }, 700);
    }, delay);
  }

  function pollSummary(ref, idx){
    let attempts = 0;
    const iv = setInterval(function(){
      attempts++;
      if(ref.step.__summary){
        fillSummarySlot(idx, ref.step.__summary);
        clearInterval(iv);
      } else if(attempts > 60){
        clearInterval(iv);
      }
    }, 80);
  }

  rollAllBtn.addEventListener('click', rollAll);
  resetBtn.addEventListener('click', function(){
    stepsContainer.innerHTML = '';
    summary.classList.remove('show');
    resetBtn.disabled = true;
    liveRegion.textContent = 'Zurückgesetzt.';
  });

})();
</script>
</body>
</html>
