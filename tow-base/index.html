<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basen-Generator</title>
<style>
  :root {
    --stone-950: #17140f;
    --stone-900: #201b14;
    --stone-800: #2c261c;
    --stone-700: #3d3526;
    --stone-500: #7a6b4f;
    --stone-300: #b8ab8c;
    --stone-100: #ede6d6;
    --bronze: #b3793f;
    --bronze-bright: #d69a5c;
    --alert: #d9734f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--stone-950);
    color: var(--stone-100);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 28px 24px 18px;
    border-bottom: 1px solid var(--stone-800);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  header p {
    margin: 0;
    color: var(--stone-300);
    font-size: 14px;
    max-width: 60ch;
  }
  main {
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 24px;
    max-width: 720px;
    margin: 0 auto;
  }
  @media (min-width: 720px) {
    main { flex-direction: row; align-items: flex-start; }
  }
  .panel {
    background: var(--stone-900);
    border: 1px solid var(--stone-800);
    border-radius: 10px;
    padding: 20px;
  }
  .controls { flex: 1; min-width: 240px; }
  .preview {
    flex: 1;
    min-width: 240px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--stone-300);
    margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }
  .field:last-of-type { margin-bottom: 0; }
  input[type="number"] {
    width: 100%;
    background: var(--stone-800);
    border: 1px solid var(--stone-700);
    color: var(--stone-100);
    padding: 9px 10px;
    border-radius: 6px;
    font-size: 15px;
  }
  input[type="number"]:focus {
    outline: 2px solid var(--bronze);
    outline-offset: 1px;
  }
  input[type="number"].invalid {
    border-color: var(--alert);
    outline-color: var(--alert);
  }
  .unit { color: var(--stone-500); font-size: 12px; margin-left: 6px; }
  .range { color: var(--stone-500); font-size: 12px; margin-top: 5px; }
  canvas {
    background: repeating-conic-gradient(var(--stone-800) 0% 25%, var(--stone-900) 0% 50%) 50% / 20px 20px;
    border-radius: 8px;
    border: 1px solid var(--stone-800);
    display: block;
    max-width: 100%;
    height: auto;
  }
  .dims {
    font-size: 13px;
    color: var(--stone-300);
    text-align: center;
    margin-top: 4px;
  }
  button {
    width: 100%;
    background: var(--bronze);
    color: var(--stone-950);
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--bronze-bright); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled {
    background: var(--stone-700);
    color: var(--stone-500);
    cursor: not-allowed;
  }
  .note {
    font-size: 12px;
    color: var(--stone-500);
    text-align: center;
    margin-top: -2px;
  }
  .note.error { color: var(--alert); }
</style>
</head>
<body>

<header>
  <h1>Basen-Generator</h1>
  <p>Maße eingeben, als STL für den 3D-Druck herunterladen. Flache, eckige Base ohne Oberflächenrelief.</p>
</header>

<main>
  <div class="panel controls">
    <div class="field">
      <label for="width">Breite <span class="unit">mm</span></label>
      <input type="number" id="width" value="30" min="5" max="200" step="0.5" inputmode="decimal">
      <div class="range">5 bis 200 mm</div>
    </div>
    <div class="field">
      <label for="depth">Tiefe <span class="unit">mm</span></label>
      <input type="number" id="depth" value="30" min="5" max="200" step="0.5" inputmode="decimal">
      <div class="range">5 bis 200 mm</div>
    </div>
    <div class="field">
      <label for="thickness">Dicke <span class="unit">mm</span></label>
      <input type="number" id="thickness" value="2" min="0.5" max="20" step="0.1" inputmode="decimal">
      <div class="range">0,5 bis 20 mm</div>
    </div>
  </div>

  <div class="panel preview">
    <canvas id="preview" width="220" height="210"></canvas>
    <div class="dims" id="dimsLabel" aria-live="polite">30 &times; 30 &times; 2 mm</div>
    <button id="downloadBtn">STL herunterladen</button>
    <div class="note" id="noteLabel">Flache Base, keine Oberflächenstruktur</div>
  </div>
</main>

<script>
  const SPECS = {
    width:     { min: 5,   max: 200, def: 30 },
    depth:     { min: 5,   max: 200, def: 30 },
    thickness: { min: 0.5, max: 20,  def: 2  },
  };
  const LABELS = { width: 'Breite', depth: 'Tiefe', thickness: 'Dicke' };
  const STORAGE_KEY = 'towBaseGeneratorState';
  const DEFAULT_NOTE = 'Flache Base, keine Oberflächenstruktur';

  const inputs = {
    width: document.getElementById('width'),
    depth: document.getElementById('depth'),
    thickness: document.getElementById('thickness'),
  };
  const canvas = document.getElementById('preview');
  const ctx = canvas.getContext('2d');
  const dimsLabel = document.getElementById('dimsLabel');
  const noteLabel = document.getElementById('noteLabel');
  const downloadBtn = document.getElementById('downloadBtn');

  // Rundet Tippfehler-Nachkommastellen weg, ohne echte Halbmillimeter zu verlieren.
  const tidy = n => Math.round(n * 100) / 100;
  const fmt = n => String(tidy(n)).replace('.', ',');

  // Liest ein Feld, ohne es zu verändern: der Nutzer tippt noch.
  function readField(key) {
    const spec = SPECS[key];
    const raw = inputs[key].value.trim();
    if (raw === '') return { value: null, state: 'empty' };
    const n = parseFloat(raw.replace(',', '.'));
    if (!isFinite(n)) return { value: null, state: 'empty' };
    if (n < spec.min || n > spec.max) return { value: tidy(n), state: 'range' };
    return { value: tidy(n), state: 'ok' };
  }

  function readAll() {
    const out = {};
    for (const key of Object.keys(SPECS)) out[key] = readField(key);
    return out;
  }

  // Isometrie: fester Blickwinkel, darum steht vorab fest, welche drei
  // Flaechen sichtbar sind - kein Tiefenpuffer, keine Kamera noetig.
  const ISO_C = Math.cos(Math.PI / 6), ISO_S = Math.sin(Math.PI / 6);
  const project = (x, y, z) => [(x - y) * ISO_C, (x + y) * ISO_S - z];

  const FACES = [
    { idx: [1, 2, 6, 5], fill: '#9b8e72' }, // rechts (x = Breite)
    { idx: [3, 2, 6, 7], fill: '#7d7259' }, // vorne  (y = Tiefe)
    { idx: [4, 5, 6, 7], fill: '#cdc1a3' }, // oben
  ];
  const BOTTOM = [0, 1, 2, 3];

  function trace(g, pts, idx) {
    g.beginPath();
    idx.forEach((i, n) => n ? g.lineTo(pts[i][0], pts[i][1]) : g.moveTo(pts[i][0], pts[i][1]));
    g.closePath();
  }

  function drawIso(g, c, w, d, t) {
    const corners = [
      [0, 0, 0], [w, 0, 0], [w, d, 0], [0, d, 0],
      [0, 0, t], [w, 0, t], [w, d, t], [0, d, t],
    ].map(p => project(p[0], p[1], p[2]));

    const xs = corners.map(p => p[0]), ys = corners.map(p => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const padding = 26;
    const scale = Math.min(
      (c.width - padding * 2) / Math.max(maxX - minX, 0.001),
      (c.height - padding * 2) / Math.max(maxY - minY, 0.001)
    );
    const offX = (c.width - (maxX - minX) * scale) / 2 - minX * scale;
    const offY = (c.height - (maxY - minY) * scale) / 2 - minY * scale;
    const pts = corners.map(p => [p[0] * scale + offX, p[1] * scale + offY]);

    // Schlagschatten: die Bodenflaeche liegt hinter dem Koerper, sichtbar
    // bleibt nur ihr weicher Rand.
    g.save();
    g.shadowColor = 'rgba(0, 0, 0, 0.5)';
    g.shadowBlur = 16;
    g.shadowOffsetY = 10;
    g.fillStyle = 'rgba(0, 0, 0, 0.5)';
    trace(g, pts, BOTTOM);
    g.fill();
    g.restore();

    g.lineJoin = 'round';
    g.lineWidth = 1.5;
    g.strokeStyle = '#17140f';
    for (const face of FACES) {
      g.fillStyle = face.fill;
      trace(g, pts, face.idx);
      g.fill();
      g.stroke();
    }
  }

  function render() {
    const f = readAll();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const bad = Object.keys(SPECS).filter(k => f[k].state !== 'ok');
    for (const key of Object.keys(SPECS)) {
      inputs[key].classList.toggle('invalid', f[key].state !== 'ok');
    }

    // Gezeichnet wird alles, was eine Zahl ist - auch zu groß oder zu klein,
    // damit die Vorschau nie etwas anderes zeigt als in den Feldern steht.
    const w = f.width.value, d = f.depth.value, t = f.thickness.value;
    if (w !== null && d !== null && t !== null) drawIso(ctx, canvas, w, d, t);

    dimsLabel.textContent = [w, d, t].every(v => v !== null)
      ? fmt(w) + ' \u00d7 ' + fmt(d) + ' \u00d7 ' + fmt(t) + ' mm'
      : '\u2014';

    if (bad.length === 0) {
      downloadBtn.disabled = false;
      noteLabel.textContent = DEFAULT_NOTE;
      noteLabel.classList.remove('error');
      save(w, d, t);
    } else {
      downloadBtn.disabled = true;
      noteLabel.classList.add('error');
      const empty = bad.filter(k => f[k].state === 'empty');
      noteLabel.textContent = empty.length
        ? 'Maß fehlt: ' + empty.map(k => LABELS[k]).join(', ')
        : bad.map(k => LABELS[k] + ' muss zwischen ' + fmt(SPECS[k].min) + ' und ' + fmt(SPECS[k].max) + ' mm liegen').join('. ');
    }
  }

  // Erst wenn das Feld verlassen wird, wird ein Wert in die Grenzen gezogen -
  // waehrend des Tippens wuerde das die Eingabe zerreissen ("3" -> "5").
  function clampField(key) {
    const spec = SPECS[key];
    const f = readField(key);
    if (f.state === 'range') {
      inputs[key].value = String(Math.min(Math.max(f.value, spec.min), spec.max));
    } else if (f.state === 'empty') {
      inputs[key].value = String(spec.def);
    } else {
      inputs[key].value = String(f.value);
    }
    render();
  }

  function save(w, d, t) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ w: w, d: d, t: t }));
    } catch (e) { /* Privater Modus o. ae.: dann eben ohne Merken. */ }
  }

  function load() {
    let saved = null;
    try {
      saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    } catch (e) { saved = null; }
    if (!saved) return;
    const map = { width: saved.w, depth: saved.d, thickness: saved.t };
    for (const key of Object.keys(SPECS)) {
      const spec = SPECS[key], v = map[key];
      if (typeof v === 'number' && isFinite(v) && v >= spec.min && v <= spec.max) {
        inputs[key].value = String(tidy(v));
      }
    }
  }

  function buildBoxSTL(w, d, h, name) {
    // 8 corner vertices of the box
    const v = [
      [0, 0, 0], [w, 0, 0], [w, d, 0], [0, d, 0], // bottom: 0-3
      [0, 0, h], [w, 0, h], [w, d, h], [0, d, h], // top: 4-7
    ];

    // [normal, i0, i1, i2] per triangle, outward-facing, right-hand rule
    const tris = [
      [[0, 0, -1], 0, 2, 1], [[0, 0, -1], 0, 3, 2],   // bottom
      [[0, 0, 1], 4, 5, 6], [[0, 0, 1], 4, 6, 7],      // top
      [[0, -1, 0], 0, 1, 5], [[0, -1, 0], 0, 5, 4],    // front (y=0)
      [[0, 1, 0], 3, 7, 6], [[0, 1, 0], 3, 6, 2],      // back (y=d)
      [[-1, 0, 0], 0, 4, 7], [[-1, 0, 0], 0, 7, 3],    // left (x=0)
      [[1, 0, 0], 1, 2, 6], [[1, 0, 0], 1, 6, 5],      // right (x=w)
    ];

    const num = n => n.toFixed(4);
    let out = `solid ${name}\n`;
    for (const [n, i0, i1, i2] of tris) {
      out += `  facet normal ${n[0]} ${n[1]} ${n[2]}\n`;
      out += `    outer loop\n`;
      for (const idx of [i0, i1, i2]) {
        const p = v[idx];
        out += `      vertex ${num(p[0])} ${num(p[1])} ${num(p[2])}\n`;
      }
      out += `    endloop\n`;
      out += `  endfacet\n`;
    }
    out += `endsolid ${name}\n`;
    return out;
  }

  function downloadSTL() {
    const f = readAll();
    // Der Button ist gesperrt, solange etwas fehlt - hier also nur Absicherung.
    if (Object.keys(SPECS).some(k => f[k].state !== 'ok')) return;
    const w = f.width.value, d = f.depth.value, t = f.thickness.value;

    const stl = buildBoxSTL(w, d, t, 'base');
    const blob = new Blob([stl], { type: 'model/stl' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `base_${w}x${d}x${t}mm.stl`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  for (const key of Object.keys(SPECS)) {
    inputs[key].addEventListener('input', render);
    inputs[key].addEventListener('change', () => clampField(key));
  }
  downloadBtn.addEventListener('click', downloadSTL);

  load();
  render();
</script>

</body>
</html>
