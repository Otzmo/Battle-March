<!-- @dsCard group="Kartenbau" height=300 -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Board</title></head>
<body>
<div class="bm-board-outer">
<div class="bm-board" style="width:calc(24 * var(--scale));height:calc(18 * var(--scale))">
<div style="position:absolute;inset:0 0 auto 0;height:calc(5 * var(--scale));background:var(--zone-p1);opacity:.8"></div>
<div style="position:absolute;inset:auto 0 0 0;height:calc(5 * var(--scale));background:var(--zone-p2);opacity:.8"></div>
<div class="bm-no-terrain" style="left:calc(8 * var(--scale));top:calc(5 * var(--scale));width:calc(8 * var(--scale));height:calc(8 * var(--scale))"><span class="strong">Kein Gelände</span><span>16" Kreis</span></div>
<div class="bm-treasure" style="left:calc(3 * var(--scale));top:calc(8.5 * var(--scale));width:14px;height:14px"></div>
<div class="bm-piece tex-forest" style="position:absolute;left:calc(18 * var(--scale));top:calc(6 * var(--scale));width:calc(3 * var(--scale));height:calc(5 * var(--scale))"><span class="bm-piece-name">Wald</span></div>
</div></div>
</body>
</html>
