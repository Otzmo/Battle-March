<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>TerrainPiece</title></head>
<body>
<div style="position:relative;display:flex;gap:28px;flex-wrap:wrap;padding:14px 10px 26px;background:var(--beige)">
<div class="bm-piece tex-forest" style="width:78px;height:130px"><span class="bm-piece-name">Wald</span><span class="bm-piece-dims">6×10"</span><div class="bm-piece-btns"><button>⟳</button><button>×</button></div><span class="bm-coord-tag">4" / 2"</span><span class="bm-coord-dot" style="left:0;top:0"></span></div>
<div class="bm-piece tex-brick" style="width:78px;height:104px"><span class="bm-piece-name">Gebäude</span><span class="bm-piece-dims">6×8"</span></div>
<div class="bm-piece tex-brick ruine" style="width:91px;height:91px"><span class="bm-piece-name">Ruine</span><span class="bm-piece-dims">7×7"</span></div>
<div class="bm-piece tex-hill" style="width:104px;height:78px"><span class="bm-piece-name">Hügel</span><span class="bm-piece-dims">8×6"</span></div>
<div class="bm-piece tex-field is-dark" style="width:78px;height:104px"><span class="bm-piece-name">Feld</span><span class="bm-piece-dims">6×8"</span></div>
<div class="bm-piece tex-water" style="width:78px;height:130px"><span class="bm-piece-name">See</span><span class="bm-piece-dims">6×10"</span></div>
<div class="bm-piece tex-brick turm is-dragging" style="width:104px;height:104px"><span class="bm-piece-name">Turm</span><span class="bm-piece-dims">8×8"</span></div>
</div>
</body>
</html>
