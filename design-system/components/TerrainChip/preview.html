<!-- @dsCard group="Kartenbau" height=160 -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>TerrainChip</title></head>
<body>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;max-width:640px">
<div class="bm-chip"><div class="bm-swatch" style="background:var(--terrain-forest)"></div><div class="bm-chip-info"><b>Wald</b>6x10"</div></div>
<div class="bm-chip"><div class="bm-swatch" style="background:var(--terrain-building)"></div><div class="bm-chip-info"><b>Gebäude</b>6x8"</div></div>
<div class="bm-chip"><div class="bm-swatch" style="background:var(--terrain-hill)"></div><div class="bm-chip-info"><b>Hügel</b>8x6"</div></div>
<div class="bm-chip"><div class="bm-swatch" style="background:var(--terrain-ruin)"></div><div class="bm-chip-info"><b>Ruine</b>7x7"</div></div>
<div class="bm-chip"><div class="bm-swatch" style="background:var(--terrain-field)"></div><div class="bm-chip-info"><b>Feld</b>6x8"</div></div>
<div class="bm-chip"><div class="bm-swatch" style="background:var(--terrain-water)"></div><div class="bm-chip-info"><b>See</b>6x10"</div></div>
<div class="bm-chip"><div class="bm-swatch" style="background:var(--terrain-tower)"></div><div class="bm-chip-info"><b>Turm</b>8x8"</div></div>
</div>
</body>
</html>
