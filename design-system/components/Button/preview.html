<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div style="display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="bm-btn">Zufällige Karte</button>
    <button class="bm-btn is-on">Zonen-Modus: AN</button>
    <button class="bm-btn bm-btn--earth">Zonen leeren</button>
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="bm-btn bm-btn--preset">1. Offene Feldschlacht</button>
    <button class="bm-btn bm-btn--preset">5. Gebirgspass</button>
    <button class="bm-btn bm-btn--brush is-active"><span class="bm-dot" style="background:var(--zone-p1)"></span>Spieler 1</button>
    <button class="bm-btn bm-btn--brush"><span class="bm-dot" style="background:var(--zone-p2)"></span>Spieler 2</button>
  </div>
  <div style="display:flex;gap:10px;max-width:520px">
    <button class="bm-btn bm-btn--block">STL herunterladen</button>
    <button class="bm-btn bm-btn--block" disabled>STL herunterladen</button>
  </div>
</div>
</body>
</html>
